name: Package Social Scheduler

on:
  push:
    branches: [main]
    paths:
      - package-trigger.txt

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deployable scheduler
        uses: actions/upload-artifact@v4
        with:
          name: techninews-social-scheduler-fixed
          path: social-scheduler/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
