name: QA 10 Slide Carousel
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find social-scheduler -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
      - name: Verify 10-slide parallel publish fix
        run: |
          grep -q "waitForContainers" social-scheduler/lib/InstagramClient.php
          grep -q "instagram_carousel_child_created" social-scheduler/lib/InstagramClient.php
          grep -q "@set_time_limit(900)" social-scheduler/cron.php
          grep -q "UID SEARCH SINCE" social-scheduler/lib/ResultMailbox.php
      - name: Build ZIP
        run: |
          zip -r webkitti-social-scheduler-10slide-fix.zip social-scheduler \
            -x 'social-scheduler/config.php' \
               'social-scheduler/storage/*.json' \
               'social-scheduler/storage/*.log' \
               'social-scheduler/storage/*.lock' \
               'social-scheduler/media/*.jpg' \
               'social-scheduler/media/*.jpeg' \
               'social-scheduler/media/*.png' \
               'social-scheduler/media/*.webp'
      - uses: actions/upload-artifact@v4
        with:
          name: webkitti-10slide-fix
          path: webkitti-social-scheduler-10slide-fix.zip
          retention-days: 7
