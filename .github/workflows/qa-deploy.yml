name: QA Deploy Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          php -v
          find social-scheduler -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
      - name: Deployment safety checks
        run: |
          test ! -f social-scheduler/config.php
          test -f social-scheduler/config.example.php
          test -f social-scheduler/cron.php
          test -f social-scheduler/bridge.php
          test -f social-scheduler/lib/ResultMailbox.php
          test -f social-scheduler/lib/ResultProcessor.php
          test -f social-scheduler/lib/InstagramClient.php
          test -f social-scheduler/media/.htaccess
          test -f social-scheduler/storage/.htaccess
          ! grep -R --line-number -E '(^|[^A-Za-z])(EA[A-Za-z0-9]{20,}|IG[A-Za-z0-9_-]{30,}|sk-[A-Za-z0-9_-]{20,})' social-scheduler --exclude='config.example.php'
      - name: Build deploy ZIP
        run: |
          zip -r webkitti-social-scheduler-deploy.zip social-scheduler             -x 'social-scheduler/config.php'                'social-scheduler/storage/*.json'                'social-scheduler/storage/*.log'                'social-scheduler/storage/*.lock'                'social-scheduler/media/*.jpg'                'social-scheduler/media/*.jpeg'                'social-scheduler/media/*.png'                'social-scheduler/media/*.webp'
      - uses: actions/upload-artifact@v4
        with:
          name: webkitti-social-scheduler-deploy
          path: webkitti-social-scheduler-deploy.zip
          if-no-files-found: error
          retention-days: 7
